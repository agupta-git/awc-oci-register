# Copy with: awc-oci-register init -o team.yaml
#
# registryHost: OCI hostname for dockerconfigjson auths (no path).
# marketplacePrefix: repository path under that host (no hostname).

registryHost: registry.example.com
marketplacePrefix: my-org/awc

auth:
  # gcr | basic | ecr | acr
  kind: gcr
  keyFile: /path/to/service-account.json
  # basic:
  # username: robot
  # passwordFile: /path/to/token
  # ecr:
  # region: us-west-2
  # acr:
  # registryName: myregistry

# Defaults below match standard AWC marketplace installs; change only if your platform team says so.
awc:
  pullSecret:
    name: awc-console-registry-creds
    namespaces:
      - auth-config-operator-system
      - awc-core
  marketplace:
    secret: awc-taikun-secrets
    namespace: awc-core
    dataKey: MARKETPLACE_REGISTRIES
    consoleDeployment: awc-console
  kubeconfig: ""

behavior:
  restartConsole: true
  skipIfPrefixPresent: true
