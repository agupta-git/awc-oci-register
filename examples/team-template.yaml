# Copy with: awc-oci-register init -o team.yaml
#
# marketplacePrefix: where the Console discovers engine/blueprint catalogs (host/path, no tag).
# registryHost: OCI hostname only for dockerconfigjson auths (defaults to first segment of prefix).

marketplacePrefix: registry.example.com/my-org/awc
registryHost: registry.example.com

auth:
  # gcpServiceAccountKey | basic | ecr | acr
  kind: gcpServiceAccountKey
  keyFile: /path/to/service-account.json
  # basic:
  # username: robot
  # passwordFile: /path/to/token
  # ecr:
  # region: us-west-2
  # acr:
  # registryName: myregistry

# Defaults below match standard AWC Hub installs; change only if your platform team says so.
awc:
  pullSecret:
    name: awc-console-registry-creds
    namespaces:
      - auth-config-operator-system
      - awc-core
  marketplace:
    secret: awc-taikun-secrets
    namespace: awc-core
    dataKey: MARKETPLACE_REGISTRIES
    consoleDeployment: awc-console
  kubeconfig: ""

behavior:
  restartConsole: true
  skipIfPrefixPresent: true
