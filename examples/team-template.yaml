# Copy with: awc-oci-register init -o team.yaml
#
# registryHost: OCI hostname for dockerconfigjson auths (no path).
# marketplacePrefix: repository path under that host (no hostname).
#
# AWC secret names, namespaces, and behavior defaults live in config/defaults.yaml
# (merged automatically). Override only what differs for your team, e.g.:
#
# awc:
#   pullSecret:
#     namespaces: [awc-core]

registryHost: registry.example.com
marketplacePrefix: my-org/awc

auth:
  # gcr | basic | ecr | acr
  kind: gcr
  keyFile: /path/to/service-account.json
  # basic:
  # username: robot
  # passwordFile: /path/to/token
  # ecr:
  # region: us-west-2
  # acr:
  # registryName: myregistry
